# This is a basic workflow to help you get started with Actions

name: Blue Pull Request & Confirm merge

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #pull_request:
  pull_request:
    types: closed
    #types: closed # review_requested edited assigned synchronize
    branches: [ "blue" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-on-merge:
    #if: startsWith(github.event.head_commit.message, 'Confirm merge')
    if: github.event.pull_request.merged == true
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: |
          echo ${{ github.event.head_commit.message }}
  
      # Replace table name
      - name: Replace
        uses: rheuvel89/replace-action@v1
        with: 
          files: 'agent.json'
          replacements: 'dialogflow_log_4=dialogflow_log'

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      # Push chaged code
      - name: Push files to Github if changed
        #uses: stefanzweifel/git-auto-commit-action@v4
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT";
            git commit -m "Modified all files"
            git push -u origin blue
          fi
